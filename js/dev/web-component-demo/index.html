<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
<title>Web component demo (dev only)</title>
<link rel="stylesheet" href="demo.css">
</head>
<body>
<header>
  <h1>Web component demo <small>development only, not shipped</small></h1>
  <p>Only the <code>&lt;embeddings-tumbler&gt;</code> element is used. Events seen: <b id="events">0</b>; policy violations: <b id="csp">0</b>.</p>
  <p>
    <button type="button" data-act="remove">remove the element</button>
    <button type="button" data-act="add">add it back</button>
    <button type="button" data-act="sample">update: send the sample set</button>
    <button type="button" data-act="small">src: 384-d</button>
    <button type="button" data-act="large">src: 1024-d</button>
    <button type="button" data-act="foreign">src: another origin</button>
    <button type="button" data-act="missing">src: missing file</button>
  </p>
  <pre id="log">no events yet</pre>
</header>
<embeddings-tumbler id="wc" src="/tests/fixtures/contract/valid-384.json" mode="tumble" seed="7"></embeddings-tumbler>
<script src="/embeddings_tumbler/static/embeddings-tumbler.js"></script>
<script src="/embeddings_tumbler/static/sample-data.js"></script>
<script src="/embeddings_tumbler/static/web-component.js"></script>

</body>
</html>
