# SonarCloud project identity. Matches the project key registered on
# SonarCloud and used by the cicd skill's Sonar status queries
# (`agentculture_embeddings-tumbler`).
sonar.projectKey=agentculture_embeddings-tumbler
sonar.organization=agentculture

# Scope: everything this repository holds is analysed and counted as source, on the
# owner's decision (2026-11-14): the package, the JavaScript modules, the shells and
# page, the dev pages, the scripts, the documentation's example code, the workflows,
# and the tests themselves. Tests are deliberately NOT declared as `sonar.tests`:
# they are held to the same rules as everything else and counted in coverage.
# (SonarCloud analyses the whole repository by default and ignores `sonar.sources`,
# so none is set; the exclusions below are the only limit.)

# Left out, each for a stated reason:
#   - caches, the virtual environment and lock data: not written here;
#   - .claude/, .qwen/, .pi/, .colleague/: vendored skills and their links, cited
#     verbatim from upstream and never edited in this repository;
#   - .devague/, .eidetic/: tool state (JSON records), not code;
#   - docs/specs/reference/: the reference demo page, a fixed input that the spec
#     compares against and that must not be edited;
#   - tests/fixtures/contract/: generated data fixtures (JSON and binary blocks).
sonar.exclusions=**/__pycache__/**,.venv/**,node_modules/**,uv.lock,.claude/**,.qwen/**,.pi/**,.colleague/**,.devague/**,.eidetic/**,docs/specs/reference/**,tests/fixtures/contract/**

# The files under embeddings_tumbler/static/ are generated copies of js/ sources
# (scripts/assemble.py, sync_static.py, sync_sample.py; CI fails when they are stale).
# They are analysed like everything else, but not counted as duplicated code: each is
# by construction identical to its source.
sonar.cpd.exclusions=embeddings_tumbler/static/**

# Coverage. Python: `uv run pytest --cov-report=xml:coverage.xml`. JavaScript:
# node's test runner writes lcov against the assembled core file, and
# scripts/js_coverage.py attributes it to the js/src modules (see
# .github/workflows/tests.yml). Paths are relative to the repo root.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=js-coverage.lcov
sonar.python.version=3.12

# Block CI on a failing quality gate. The scanner polls SonarCloud and exits
# non-zero on a red gate (coverage regression, new bugs/vulnerabilities). Only
# takes effect when the SonarCloud Scan step runs — that step is guarded by
# `if: env.SONAR_TOKEN != ''` in .github/workflows/tests.yml, so token-less
# repos and fork PRs (no injected secret) skip the scan and stay green.
sonar.qualitygate.wait=true
