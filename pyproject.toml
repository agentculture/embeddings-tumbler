[project]
name = "embeddings-tumbler"
version = "0.11.5"
description = "Visualize embedding space: tumble, lattice and wander through high-dimensional embeddings in a 3-D window."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/agentculture/embeddings-tumbler"
Issues = "https://github.com/agentculture/embeddings-tumbler/issues"

[project.scripts]
embeddings-tumbler = "embeddings_tumbler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["embeddings_tumbler"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.1",
    "bandit>=1.7.5",
    "flake8>=6.1",
    "isort>=5.12.0",
    "black>=23.7.0",
    "teken>=0.8",
    "pyyaml>=6.0",
    "playwright>=1.65,<1.66",
]

[tool.coverage.run]
# One source root, the repository: every Python file counts (the package, the scripts,
# the tests, the documentation's examples), and coverage.xml names each file by its
# repo-relative path. Several roots would make names such as `__init__.py` ambiguous
# and SonarCloud would drop them.
source = ["."]
omit = [".venv/*", "**/__pycache__/*", ".claude/*", "node_modules/*"]
relative_files = true

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["embeddings_tumbler"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --dist loadgroup"
