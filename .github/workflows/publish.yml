name: Publish to PyPI and npm

# Two registries, one core file, trusted publishing only (OIDC; no registry
# token exists anywhere in this repository or its secrets). See docs/release.md.
#
# Pull request (same-repo only): test -> verify-packages -> test-publish (TestPyPI
#   dev build). npm has no test registry and its versions can never be reused,
#   so nothing goes to npm from a pull request; the dry-run build of both
#   packages is in packages.yml and in verify-packages below.
# Push to main: test -> verify-packages -> publish-npm -> publish (PyPI).
#   Every job checks out the same commit (github.sha). The byte-identity check
#   (wheel, sdist and npm tarball) runs in verify-packages before either
#   registry is touched, and again in each publish job on the exact files that
#   job uploads.
#   npm goes first: it is the newer channel and the likelier to fail, and a
#   failure there leaves nothing published. Both publish jobs are safe to
#   re-run: PyPI skips files already uploaded (--check-url) and the npm job
#   skips a version already on npm after checking that it matches this commit.

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "package.json"
      - "embeddings_tumbler/**"
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "package.json"
      - "embeddings_tumbler/**"

# Every `run:` step uses bash with -e and -o pipefail (GitHub's explicit-bash
# invocation); multi-line steps add `set -euo pipefail` themselves.
defaults:
  run:
    shell: bash

# Never run two publishes of the same ref at once; never cancel one midway.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - run: uv sync --locked --no-build

      - run: uv run --locked --no-build pytest -n auto -v

  verify-packages:
    # Builds both packages from this commit and fails unless the wheel and the
    # npm tarball carry byte-identical viewer files with one version.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: install npm 11.21.1
        run: |
          set -euo pipefail
          npm install -g npm@11.21.1 --ignore-scripts
          npm --version

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - name: build the wheel, the sdist and the npm tarball and check they agree
        run: python3 scripts/check_packages.py --out-dir dist-packages

  test-publish:
    # Skip on fork PRs — no OIDC/environment context is available there, so the
    # publish step would fail and block external contributor CI.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [test, verify-packages]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - run: uv sync --locked --no-build

      - name: Set dev version
        run: |
          set -euo pipefail
          BASE="$(python3 scripts/project_version.py get)"
          DEV_VERSION="${BASE}.dev${{ github.run_number }}"
          # Rewrites only [project].version (a line-oriented `^version =` rewrite would also
          # hit a [tool.*] table's version line).
          python3 scripts/project_version.py set "${DEV_VERSION}"
          echo "DEV_VERSION=${DEV_VERSION}" >> "$GITHUB_ENV"
          echo "Publishing ${DEV_VERSION} to TestPyPI"

      - name: Build and publish to TestPyPI
        run: |
          set -euo pipefail
          uv build
          uv publish --publish-url https://test.pypi.org/legacy/ --trusted-publishing always --check-url https://test.pypi.org/simple/

      - name: Print install commands
        if: always()
        run: |
          echo "::notice::Test with: uv tool install --index-url https://test.pypi.org/simple/ --index-strategy unsafe-best-match embeddings-tumbler==${DEV_VERSION:-unknown}"

  publish-npm:
    if: github.event_name == 'push'
    needs: [test, verify-packages]
    runs-on: ubuntu-latest
    # The npm trusted publisher for @culture.dev/embeddings-tumbler names this
    # workflow file (publish.yml) and this environment (npm).
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: install npm 11.21.1 (trusted publishing needs 11.5.1 or later)
        run: |
          set -euo pipefail
          npm install -g npm@11.21.1 --ignore-scripts
          node -e '
            const v = process.argv[1].split(".").map(Number);
            const ok = v[0] > 11 || (v[0] === 11 && (v[1] > 5 || (v[1] === 5 && v[2] >= 1)));
            if (!ok) { console.error("npm " + process.argv[1] + " is older than 11.5.1"); process.exit(1); }
            console.log("npm " + process.argv[1]);
          ' "$(npm --version)"

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - name: build the wheel, the sdist and the npm tarball from this commit and check them
        id: build
        run: python3 scripts/check_packages.py --out-dir dist-packages --github-output "$GITHUB_OUTPUT"

      # Prints `absent` or `present`; any other answer from npm (network or
      # registry error, unreadable output) fails this step, so nothing publishes.
      - name: is this version already on npm?
        id: npm
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          STATE="$(python3 scripts/npm_release_state.py @culture.dev/embeddings-tumbler "$VERSION")"
          echo "state=${STATE}" >> "$GITHUB_OUTPUT"
          echo "spec=@culture.dev/embeddings-tumbler@${VERSION}" >> "$GITHUB_OUTPUT"
          echo "@culture.dev/embeddings-tumbler@${VERSION} is ${STATE} on npm"

      # A re-run, or the one-time bootstrap publish, already made this version.
      # Never publish over it (npm refuses; versions cannot be reused): prove
      # the registry copy matches this commit, or fail.
      - name: already on npm; check the registry copy matches this commit
        if: steps.npm.outputs.state == 'present'
        env:
          WHEEL: ${{ steps.build.outputs.wheel }}
          SDIST: ${{ steps.build.outputs.sdist }}
          SPEC: ${{ steps.npm.outputs.spec }}
        run: python3 scripts/check_packages.py --wheel "$WHEEL" --sdist "$SDIST" --registry-tarball "$SPEC" --out-dir published

      - name: publish to npm by trusted publishing
        if: steps.npm.outputs.state == 'absent'
        env:
          TARBALL: ${{ steps.build.outputs.tarball }}
        run: npm publish "$TARBALL" --provenance --access public

  publish:
    if: github.event_name == 'push'
    # PyPI waits for npm so that a failed npm publish leaves nothing published.
    needs: [test, verify-packages, publish-npm]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - run: uv python install 3.12

      - run: uv sync --locked --no-build

      # npm is needed only to pack a tarball to compare the wheel against.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      # Builds the wheel and the sdist (both go to PyPI, as before t13) plus an
      # npm tarball, checks all three agree, and hands on the exact paths.
      - name: Build the wheel and sdist and check them against the npm tarball
        id: build
        run: python3 scripts/check_packages.py --out-dir dist-pypi --github-output "$GITHUB_OUTPUT"

      - name: Publish the checked wheel and sdist to PyPI
        env:
          WHEEL: ${{ steps.build.outputs.wheel }}
          SDIST: ${{ steps.build.outputs.sdist }}
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ "$WHEEL" "$SDIST"
